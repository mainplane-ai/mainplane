name: catalog
# Publishes the catalog at dl.mainplane.ai/catalog/v1.json: on a merge that
# changes it, and daily, for models.dev's new prices and limits.
on:
  push:
    branches: [main]
    paths: ["pkg/catalog/**", "pkg/provider/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One at a time, so an older checkout never overwrites a newer catalog.
concurrency:
  group: catalog-${{ github.ref }}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
      - run: go run ./pkg/catalog/build > catalog.json
      # Connectors read it at every start, so a short cache.
      - name: upload to R2
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" | jq -r .result.id)
          secret=$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$id:$secret" -H "Content-Type: application/json" -H "Cache-Control: max-age=300" -T catalog.json "https://$ACCOUNT.r2.cloudflarestorage.com/mainplane-releases/catalog/v1.json"

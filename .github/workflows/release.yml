name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  TAG: ${{ github.ref_name }}
  BUCKET: mainplane-releases
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The environment holds the Azure ids and admits v* tags only; Azure trusts
    # this environment's OIDC subject and nothing else.
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
      - name: tag is vX.Y.Z or vX.Y.Z-rc.N, on main
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $TAG is not on main"; exit 1; }
      # An rc ships the notes of the release it is a candidate for.
      - name: notes from docs/CHANGELOG.md
        run: |
          awk -v h="## ${TAG%%-*}" '$0 == h {f = 1; next} /^## / {f = 0} f' docs/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "docs/CHANGELOG.md has no section '## ${TAG%%-*}'"; exit 1; }
      - name: build
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            for b in mainplane mainplane-server; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/mainplane-ai/mainplane/pkg/version.V=$TAG" -o "dist/$b-$os-$arch$ext" "./cmd/$b"
            done
          done
          [ "$(dist/mainplane-linux-amd64 version)" = "$TAG" ]
          for s in install.sh install.ps1; do sed "s/@VERSION@/$TAG/g" "install/$s" > "dist/$s"; done
          cp docs/CHANGELOG.md dist/
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Defender blocks unsigned Go binaries as Sabsik.FL.A!ml. Artifact Signing
      # certificates live three days, so every signature is timestamped and no
      # thumbprint is pinned. One jsign call signs all four: each call costs an
      # extra API request for the chain.
      - name: Authenticode sign Windows binaries
        env:
          JSIGN_SHA256: 7b4a01ba81e9ee866f09a5e45d40c928707eb5286f4e20d4042c67a141ae5e62
        run: |
          curl -fsSLo "$RUNNER_TEMP/jsign.deb" https://github.com/ebourg/jsign/releases/download/7.5/jsign_7.5_all.deb
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign.deb" | sha256sum -c
          sudo apt-get update -qq && sudo apt-get install -y -qq "$RUNNER_TEMP/jsign.deb"
          TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          export TOKEN
          jsign --storetype TRUSTEDSIGNING --keystore "${{ vars.ARTIFACT_SIGNING_ENDPOINT }}" --storepass env:TOKEN \
            --alias "${{ vars.ARTIFACT_SIGNING_ACCOUNT }}/${{ vars.ARTIFACT_SIGNING_PROFILE }}" \
            --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 dist/*-windows-*.exe
      # After signing: the sums cover the bytes users run.
      - name: SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS
      # Binaries update only to a SHA256SUMS this key signed; the check stops a
      # release whose key is not the one the binaries carry.
      - name: sign SHA256SUMS
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          grep -qF "$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | base64)" pkg/release/release.go || { echo "RELEASE_SIGNING_KEY is not the key in pkg/release/release.go"; exit 1; }
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm "$RUNNER_TEMP/key.pem"
      # The token is scoped to the bucket, which R2 honors on its S3 API only.
      # Its S3 key id is the token id and its secret the token's sha256.
      # latest names the newest stable release for mainplane-server update. It
      # goes last, so it never names a release still uploading, and uncached,
      # since it is the one path whose bytes change. A tag below the current
      # latest leaves it; the first release finds none.
      - name: upload to R2
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" | jq -r .result.id)
          secret=$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          for f in dist/*; do
            ct=application/octet-stream
            case $f in *.sh | *.ps1 | *.md | */SHA256SUMS) ct="text/plain; charset=utf-8" ;; esac
            curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$id:$secret" -H "Content-Type: $ct" -T "$f" "https://$ACCOUNT.r2.cloudflarestorage.com/$BUCKET/$TAG/${f#dist/}"
          done
          cur=$(curl -fsS https://dl.mainplane.ai/latest || true)
          if [[ $TAG != *-rc.* && $(printf '%s\n' "$cur" "$TAG" | sort -V | tail -1) == "$TAG" ]]; then
            printf '%s\n' "$TAG" > "$RUNNER_TEMP/latest"
            curl -fsS --aws-sigv4 aws:amz:auto:s3 --user "$id:$secret" -H "Content-Type: text/plain" -H "Cache-Control: no-store" -T "$RUNNER_TEMP/latest" "https://$ACCOUNT.r2.cloudflarestorage.com/$BUCKET/latest"
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; [[ $TAG == *-rc.* ]] && pre=--prerelease
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md $pre

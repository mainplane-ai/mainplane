name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  TAG: ${{ github.ref_name }}
  BUCKET: mainplane-releases
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: useblacksmith/setup-go@647ac649bd5b480f2a262e3e3e5f4d150ed452ad # v6.0.1
        with:
          go-version-file: go.mod
      - name: tag is vX.Y.Z or vX.Y.Z-rc.N, on main
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $TAG is not on main"; exit 1; }
      # An rc ships the notes of the release it is a candidate for.
      - name: notes from docs/CHANGELOG.md
        run: |
          awk -v h="## ${TAG%%-*}" '$0 == h {f = 1; next} /^## / {f = 0} f' docs/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "docs/CHANGELOG.md has no section '## ${TAG%%-*}'"; exit 1; }
      - name: build
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            for b in mainplane mainplane-server; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/mainplane-ai/mainplane/pkg/version.V=$TAG" -o "dist/$b-$os-$arch$ext" "./cmd/$b"
            done
          done
          [ "$(dist/mainplane-linux-amd64 version)" = "$TAG" ]
          cd dist && sha256sum * > SHA256SUMS
      - name: upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in dist/*; do
            npx --yes wrangler@4.136.3 r2 object put "$BUCKET/$TAG/${f#dist/}" --file "$f" --remote
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; [[ $TAG == *-rc.* ]] && pre=--prerelease
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md $pre

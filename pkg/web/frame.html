<!doctype html>
<meta charset="utf-8">
<script>
// A dashboard is shown here: this frame has an origin of its own and no
// network, and holds no key. The page around it sends the dashboard's HTML.
addEventListener("message", e => {
  if (e.source !== parent || typeof e.data?.html !== "string") return
  document.open(); document.write(e.data.html); document.close()
})
parent.postMessage({ ready: true }, "*")
</script>

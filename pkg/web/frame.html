<!doctype html>
<meta charset="utf-8">
<script>
// A dashboard is shown here: this frame has an origin of its own and holds
// no key. The page around it sends the dashboard's HTML and answers what the
// dashboard asks with mainplane.call; mainplane.watch hears the store change,
// and mainplane.preview makes a file of the store a blob: URL to show.
addEventListener("message", e => {
  if (e.source !== parent || typeof e.data?.html !== "string") return
  document.open() // the listeners end here: the dashboard starts with these alone
  const waiting = new Map(), watchers = []
  // types is what a browser must be told to show a file in a frame or play it; an image it knows by its bytes.
  const types = { html: "text/html;charset=utf-8", svg: "image/svg+xml", mp4: "video/mp4", webm: "video/webm", mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav" }
  let seq = 0
  window.mainplane = {
    call: (name, args) => new Promise((resolve, reject) => { waiting.set("mp" + ++seq, { resolve, reject }); parent.postMessage({ ...args, id: "mp" + seq, call: name }, "*") }),
    watch: fn => watchers.push(fn),
    preview: async name => URL.createObjectURL(new Blob([await mainplane.call("read", { name })], { type: types[name.split(".").pop().toLowerCase()] ?? "" })),
  }
  addEventListener("message", e => {
    if (e.source !== parent) return
    const w = waiting.get(e.data.id)
    if (w) { waiting.delete(e.data.id); "error" in e.data ? w.reject(new Error(e.data.error)) : w.resolve(e.data.result) }
    if (e.data.event === "changed") watchers.forEach(fn => fn(e.data))
  })
  // A link opens beside the interface: this frame goes nowhere.
  addEventListener("click", e => { const a = e.target.closest?.("a[href]:not([href^='#'], [target])"); if (a) a.target = "_blank" }, true)
  // A picture clicked opens large over the interface (not one in a link or a button, nor an icon).
  addEventListener("click", e => {
    const img = e.target.closest?.("img")
    if (!img || img.closest("a, button") || img.width < 80) return
    // Drawn and sent as a PNG: the frame may not fetch (connect-src none), and the page around cannot load this frame's blob: URL.
    const c = Object.assign(document.createElement("canvas"), { width: img.naturalWidth, height: img.naturalHeight })
    c.getContext("2d").drawImage(img, 0, 0)
    c.toBlob(image => parent.postMessage({ image, alt: img.alt }, "*"))
  })
  // A swipe on the page goes to the interface: on a phone it moves between the project's views.
  let t0 = null
  const slides = el => !!el && el.nodeType === 1 && ((el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflowX !== "visible") || slides(el.parentElement))
  addEventListener("touchstart", e => { const t = e.touches[0]; t0 = e.touches.length === 1 && t.clientX > 24 && !e.target.closest?.("textarea, input") && !slides(e.target) ? [t.clientX, t.clientY, Date.now()] : null }, { passive: true })
  addEventListener("touchend", e => { const t = e.changedTouches[0]; if (t0) parent.postMessage({ swipe: [t.clientX - t0[0], t.clientY - t0[1], Date.now() - t0[2]] }, "*"); t0 = null }, { passive: true })
  document.write(e.data.html); document.close()
  // The interface's glass header and composer float over the page: it starts under the one and ends above the other.
  const [top, bottom] = e.data.inset
  // The page keeps its own height (a board's panels scroll in it): the root is padded, and on a phone, where the page scrolls, its end is.
  document.head.append(Object.assign(document.createElement("style"), { textContent: `html { box-sizing: border-box; height: 100%; padding: ${top}px 0 ${bottom}px } @media (max-width: 700px) { html { padding-bottom: 0 } body::after { content: ""; display: block; height: ${bottom}px } }` }))
})
parent.postMessage({ ready: true }, "*")
</script>

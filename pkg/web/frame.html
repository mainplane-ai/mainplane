<!doctype html>
<meta charset="utf-8">
<script>
// A dashboard is shown here: this frame has an origin of its own and holds
// no key. The page around it sends the dashboard's HTML and answers what the
// dashboard asks with mainplane.call; mainplane.watch hears the store change.
addEventListener("message", e => {
  if (e.source !== parent || typeof e.data?.html !== "string") return
  document.open() // the listeners end here: the dashboard starts with these alone
  const waiting = new Map(), watchers = []
  let seq = 0
  window.mainplane = {
    call: (name, args) => new Promise((resolve, reject) => { waiting.set("mp" + ++seq, { resolve, reject }); parent.postMessage({ ...args, id: "mp" + seq, call: name }, "*") }),
    watch: fn => watchers.push(fn),
  }
  addEventListener("message", e => {
    if (e.source !== parent) return
    const w = waiting.get(e.data.id)
    if (w) { waiting.delete(e.data.id); "error" in e.data ? w.reject(new Error(e.data.error)) : w.resolve(e.data.result) }
    if (e.data.event === "changed") watchers.forEach(fn => fn(e.data))
  })
  // A link opens beside the interface: this frame goes nowhere.
  addEventListener("click", e => { const a = e.target.closest?.("a[href]:not([href^='#'], [target])"); if (a) a.target = "_blank" }, true)
  document.write(e.data.html); document.close()
})
parent.postMessage({ ready: true }, "*")
</script>

[project]
name = "mainplane"
version = "0.0.0"
description = "The open-source agent ecosystem. Agents that work across all your computers, browsers and files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
urls = { Homepage = "https://mainplane.ai", Source = "https://github.com/mainplane-ai/mainplane" }
scripts = { mainplane = "mainplane:main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["mainplane/SHA256SUMS"]

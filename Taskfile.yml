version: "3"

tasks:
  lint:
    cmds:
      - golangci-lint run ./...
      - gofumpt -l .
      - go mod tidy -diff

  test:
    cmds:
      - go test -race ./...

  vuln:
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  ci:
    deps: [lint, test, vuln]

  # The release gate, on real machines: task e2e -- <v> <prev> <host:port> <os>=<ssh target>...
  e2e:
    cmds:
      - go run ./e2e {{.CLI_ARGS}}
